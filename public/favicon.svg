<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ArithmoSofia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4965"/>
      <stop offset="1" stop-color="#0b1f2a"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#cbbfa6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Greek meander (key) border -->
  <g transform="translate(5 5) scale(2.25)">
    <g fill="#d4a437">
      <rect x="0" y="0" width="24" height="4"/>
      <rect x="18" y="0" width="4" height="24"/>
      <rect x="0" y="20" width="18" height="4"/>
      <rect x="0" y="4" width="4" height="16"/>
      <rect x="4" y="4" width="10" height="4"/>
      <rect x="14" y="8" width="4" height="12"/>
    </g>
  </g>

  <!-- Ionic column -->
  <g transform="translate(32 8)">
    <path d="M-11 6 Q0 -1 11 6 L9.5 9.5 H-9.5 Z" fill="url(#marble)"/>
    <rect x="-8.5" y="9.5" width="17" height="2.5" fill="#d4a437"/>
    <rect x="-6" y="12" width="12" height="19" fill="url(#marble)"/>
    <g fill="#1b4965" opacity="0.55">
      <rect x="-3.4" y="12" width="0.9" height="19"/>
      <rect x="-0.6" y="12" width="0.9" height="19"/>
      <rect x="2.2" y="12" width="0.9" height="19"/>
    </g>
    <rect x="-8" y="31" width="16" height="2.5" fill="#d4a437"/>
    <path d="M-11 33.5 H11 L9.5 36 H-9.5 Z" fill="url(#marble)"/>
  </g>

  <!-- Numerals of Theos: 2 8 4 -->
  <text x="32" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="700" fill="#d4a437" letter-spacing="1.5">284</text>
</svg>